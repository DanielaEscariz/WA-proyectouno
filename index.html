<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>SÓNAR 2027</title>

        <!-- CSS: -->
        <link rel="stylesheet" href="css/styles.css">
    </head>




    <body>
<!-- MENÚ DE NAVEGACIÓN -->
    <nav class="nav">
        <div class="nav__inner">
            <!-- LOGO SÓNAR -->
            <a href="#inicio" class="nav__logo">
                <img src="media/img/home/nav/logo_sonar.webp" alt="Sónar"> 
            </a>

            <ul class="nav__links" id="menu">
                <li><a href="#inicio">INICIO</a></li>
                <li><a href="#datos">LINEUP</a></li>
                <li><a href="#galeria">EXPERIENCIA</a></li>
                <li><a href="#sobre">TICKETS</a></li>
            </ul>

            <div class="nav__actions">
                <!-- BOTÓN MODO CLARO/OSCURO -->
                <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Cambiar tema">
                    <img src="media/img/home/nav/icono_modoclaro.webp" alt="Modo Claro" class="theme-toggle__icon theme-toggle__icon--sun">
                    <img src="media/img/home/nav/icono_modooscuro.webp" alt="Modo Oscuro" class="theme-toggle__icon theme-toggle__icon--moon">
                </button>                


            <!-- Botón Menú Hamburguesa (Móvil) -->
            <button class="menu-toggle" id="menu-toggle" aria-label="Abrir menú">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>
            </div>
        </div>
    </nav>    

<!-- HERO SECTION -->
    <section class="hero" id="inicio">
        <div class="hero__container">
            <img src="media/img/home/hero/HERO.webp" alt="Sónar Festival" class="hero__bg">
            
            <div class="hero__content">
                <a href="#tickets" class="hero__btn">COMPRA TUS TICKETS</a>
                <h1 class="hero__title">FESTIVAL 2027</h1>
            </div>
        </div>
    </section>

</html>
