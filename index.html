<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>SÓNAR 2027</title>

        <!-- CSS: -->
        <link rel="stylesheet" href="css/styles.css">
    </head>




    <body>
<!-- MENÚ DE NAVEGACIÓN -->
    <nav class="nav">
        <div class="nav__inner">
            <!-- LOGO SÓNAR -->
            <a href="#inicio" class="nav__logo">
                <img src="media/img/home/nav/logo_sonar.webp" alt="Sónar"> 
            </a>

            <ul class="nav__links" id="menu">
                <li><a href="#inicio">INICIO</a></li>
                <li><a href="#lineup">LINEUP</a></li>
                <li><a href="#galeria">GALERÍA</a></li>
                <li><a href="#sobre">TICKETS</a></li>
            </ul>

            <div class="nav__actions">
                <!-- BOTÓN MODO CLARO/OSCURO -->
                <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Cambiar tema">
                    <img src="media/img/home/nav/icono_modoclaro.webp" alt="Modo Claro" class="theme-toggle__icon theme-toggle__icon--sun">
                    <img src="media/img/home/nav/icono_modooscuro.webp" alt="Modo Oscuro" class="theme-toggle__icon theme-toggle__icon--moon">
                </button>                


            <!-- Botón Menú Hamburguesa (Móvil) -->
            <button class="menu-toggle" id="menu-toggle" aria-label="Abrir menú">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>
            </div>
        </div>
    </nav>    

<!-- HERO  -->
    <section class="hero" id="inicio">
        <div class="hero__container">
            <img src="media/img/home/hero/HERO.webp" alt="Sónar Festival" class="hero__bg">
            
            <div class="hero__content">
                <a href="#tickets" class="hero__btn">COMPRA TUS TICKETS</a>
                <h1 class="hero__title">FESTIVAL 2027</h1>
            </div>
        </div>
    </section>



<!-- LINEUP -->
    <section class="lineup section" id="lineup">
        <div class="container">
            <h2 class="lineup__title">LINEUP</h2>

            <div class="lineup__grid">
                <!-- TARJETA ALBA F -->
                <article class="lineup__card lineup__card--tall">
                    <div class="lineup__img-wrap">
                        <img src="media/img/home/lineup/ALBA F.webp" alt="Afri K" class="lineup__img">
                    </div>
                    <div class="lineup__info">
                        <span class="lineup__artist text-blue">ALBA F</span>
                        <span class="lineup__day text-blue">domingo 21</span>
                    </div>
                </article>

                <!-- TARJETA DOM DOLLA -->
                <article class="lineup__card lineup__card--wide">
                    <div class="lineup__img-wrap">
                        <img src="media/img/home/lineup/DOM DOLLA.webp" alt="Dom Dolla" class="lineup__img">
                    </div>
                    <div class="lineup__info">
                        <span class="lineup__artist text-red">DOM DOLLA</span>
                        <span class="lineup__day text-red">SÁBADO 20</span>
                    </div>
                </article>

                <!-- TARJETA AFRI K -->
                <article class="lineup__card">
                    <div class="lineup__img-wrap">
                        <img src="media/img/home/lineup/AFRI K.webp" alt="Afri K" class="lineup__img">
                    </div>
                    <div class="lineup__info">
                        <span class="lineup__artist text-green">AFRI K</span>
                        <span class="lineup__day text-green">Viernes 19</span>
                    </div>
                </article>

                <!-- TARJETA DJ GIGOLA -->
                <article class="lineup__card">
                    <div class="lineup__img-wrap">
                        <img src="media/img/home/lineup/DJ GIGOLA.webp" alt="DJ Gigola" class="lineup__img">
                    </div>
                    <div class="lineup__info">
                        <span class="lineup__artist text-red">DJ GIGOLA</span>
                        <span class="lineup__day text-red">SÁBADO 20</span>
                    </div>
                </article>

                <!-- TARJETA KTTAMA -->
                <article class="lineup__card">
                    <div class="lineup__img-wrap">
                        <img src="media/img/home/lineup/KTTAMA.webp" alt="Kttama" class="lineup__img">
                    </div>
                    <div class="lineup__info">
                        <span class="lineup__artist text-green">KTTAMA</span>
                        <span class="lineup__day text-green">Viernes 19</span>
                    </div>
                </article>

                <!-- TARJETA AMELIE LENS -->
                <article class="lineup__card lineup__card--wide">
                    <div class="lineup__img-wrap">
                        <img src="media/img/home/lineup/AMELIE LENS.webp" alt="Amelie Lens" class="lineup__img">
                    </div>
                    <div class="lineup__info">
                        <span class="lineup__artist text-blue">AMELIE LENS</span>
                        <span class="lineup__day text-blue">domingo 21</span>
                    </div>
                </article>

                <!-- TARJETA ICEMORPH -->
                <article class="lineup__card">
                    <div class="lineup__img-wrap">
                        <img src="media/img/home/lineup/ICEMORPH.webp" alt="Icemorph" class="lineup__img">
                    </div>
                    <div class="lineup__info">
                        <span class="lineup__artist text-blue">ICEMORPH</span>
                        <span class="lineup__day text-blue">domingo 20</span>
                    </div>
                </article>

                <!-- TARJETA S. LANDRY -->
                <article class="lineup__card">
                    <div class="lineup__img-wrap">
                        <img src="media/img/home/lineup/S LANDRY.webp" alt="S. Landry" class="lineup__img">
                    </div>
                    <div class="lineup__info">
                        <span class="lineup__artist text-red">S. LANDRY</span>
                        <span class="lineup__day text-red">SÁBADO 21</span>
                    </div>
                </article>

                <!-- TARJETA ARTHI -->
                <article class="lineup__card">
                    <div class="lineup__img-wrap">
                        <img src="media/img/home/lineup/ARTHY.webp" alt="Arthi" class="lineup__img">
                    </div>
                    <div class="lineup__info">
                        <span class="lineup__artist text-green">ARTHI</span>
                        <span class="lineup__day text-green">Viernes 19</span>
                    </div>
                </article>
            </div>
        </div>
    </section>
 


<!-- GALERÍA -->
    <section class="gallery section" id="galeria">
        <div class="container">
            <h2 class="gallery__title">GALERÍA</h2>

            <div class="gallery__grid">
                <!-- FOTO VERTICAL UNO -->
                <div class="gallery__item gallery__item--tall">
                    <img src="media/img/home/galeria/verticaluno.webp" alt="Sónar ambiente" class="gallery__img">
                </div>

                <!-- FOTO HORIZONTAL UNO -->
                <div class="gallery__item gallery__item--wide">
                    <img src="media/img/home/galeria/horizontaluno.webp" alt="Sónar luces rojas" class="gallery__img">
                </div>

                <!-- FOTO CUADRADA UNO -->
                <div class="gallery__item">
                    <img src="media/img/home/galeria/cuadradauno.webp" alt="Sónar público" class="gallery__img">
                </div>

                <!-- FOTO CUADRADA DOS -->
                <div class="gallery__item">
                    <img src="media/img/home/galeria/cuadradados.webp" alt="Sónar DJ" class="gallery__img">
                </div>

                <!-- FOTO CUADRADA TRES -->
                <div class="gallery__item">
                    <img src="media/img/home/galeria/cuadradatres.webp" alt="Sónar luces rojas público" class="gallery__img">
                </div>

                <!-- FOTO HORIZONTAL DOS -->
                <div class="gallery__item gallery__item--wide">
                    <img src="media/img/home/galeria/horizontaldos.webp" alt="Sónar luces verdes" class="gallery__img">
                </div>
                
                <!-- FOTO CUADRADA SEIS -->
                <div class="gallery__item">
                    <img src="media/img/home/galeria/cuadradaseis.webp" alt="Sónar DJ cortina roja" class="gallery__img">
                </div>
                
                <!-- FOTO CUADRADA CINCO -->
                <div class="gallery__item">
                    <img src="media/img/home/galeria/cuadradacinco.webp" alt="Sónar DJ luces verdes" class="gallery__img">
                </div>
                
                <!-- FOTO CUADRADA CUATRO -->
                <div class="gallery__item">
                    <img src="media/img/home/galeria/cuadradacuatro.webp" alt="Sónar DJ mujer" class="gallery__img">

</html>
